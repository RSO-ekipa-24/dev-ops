ingress:
  enabled: true
  mainHost: myproperty-essa.com
  annotations:
    kubernetes.io/ingress.class: "gce"  # Tells GKE to use its own Ingress Controller (required when setting annotations)
    kubernetes.io/ingress.global-static-ip-name: myproperty-essa-ip    # bind ingress to reserved static IP
    networking.gke.io/managed-certificates: myproperty-essa-cert-v4       # bind GKE-managed certicate
    kubernetes.io/ingress.allow-http: "false"

  # keycloak
  services:
    keycloak:
      host: keycloak.myproperty-essa.com
      serviceName: keycloak-service
      servicePort: 8080
    core:
      host: core.myproperty-essa.com
      serviceName: core-service
      servicePort: 8080
    files:
      host: files.myproperty-essa.com
      serviceName: files-service
      servicePort: 8080
    imageClassification:
      host: image-classification.myproperty-essa.com
      serviceName: image-classification-service
      servicePort: 8080